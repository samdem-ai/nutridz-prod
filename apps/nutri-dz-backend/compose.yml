services:

  mysql:
    image: mysql:8.0
    container_name: nutridz_mysql
    environment:
      MYSQL_DATABASE: nutridz_db
      MYSQL_USER: nutridz_user
      MYSQL_PASSWORD: nutridz_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nutridz_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nutridz_user
      RABBITMQ_DEFAULT_PASS: nutridz_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nutridz_ai
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER:-https://nutridz.app}
      OPENROUTER_TITLE: ${OPENROUTER_TITLE:-NutriDz}
      # Nutrition-label OCR vision provider (Groq by default)
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://api.groq.com/openai/v1}
      VISION_MODEL: ${VISION_MODEL:-qwen/qwen3.8-27b}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: nutridz_backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nutridz_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: nutridz_user
      SPRING_DATASOURCE_PASSWORD: nutridz_pass

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: nutridz_user
      SPRING_RABBITMQ_PASSWORD: nutridz_pass

      JWT_SECRET: ${JWT_SECRET:-nutridz_super_secret_key_change_in_production}
      JWT_EXPIRATION: 86400000

      AI_SERVICE_URL: http://ai-service:8000

      # Public URL of this API — used to build product image URLs the app loads
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      # Comma-separated origins allowed to call the API (the admin website)
      ADMIN_WEB_ORIGINS: ${ADMIN_WEB_ORIGINS:-http://localhost:8082}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: ../admin-web
      args:
        VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:-/api}
    container_name: nutridz_admin_web
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped

volumes:
  mysql_data: